name: Upload

on:
  push:
    tags:
      - v*.*.*

jobs:
  upload:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
      # requirements-ci.txt needs Python >= 3.10 (see the Pillow note there).
      # The matrix that used to sit here was never wired into setup-python, so
      # this job silently ran on whatever the runner defaulted to.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install stuff
        run: |
          sudo apt-get update
          sudo apt-get install build-essential gcc git pkg-config libglib2.0-dev libexpat1-dev libvips
          sudo apt-get install imagemagick -y
          sudo apt-get install python3-pip -y
          python -m pip install --upgrade pip
      - name: Install req.
        run: |
          pip3 install -r requirements-ci.txt
          pip3 install -r requirements-dev.txt
      - name: Upload Seals
        working-directory: seal_rookery/
        run: |
          python3 upload_images.py \
          -a ${{ secrets.AWS_ACCESS_KEY }} \
          -s ${{ secrets.AWS_SECRET_KEY }}
      - name: Install packaging
        run: python -m pip install -U packaging
      - name: Publish package
        uses: casperdcl/deploy-pypi@v2
        with:
          password: ${{ secrets.pypi_token }}
          build: true
